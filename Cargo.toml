[package]
name = "orchestrator"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
pbjson = "0.9.0"
pbjson-types = "0.9.0"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"

[build-dependencies]
pbjson-build = "0.9.0"
prost-build = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
